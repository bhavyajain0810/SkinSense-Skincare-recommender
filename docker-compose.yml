version: "3.9"

services:
  llm_api:
    build:
      context: ./llm_api
    container_name: skinsense-llm-api
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-mock}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8001:8001"

  app:
    build:
      context: .
    container_name: skinsense-app
    environment:
      # Ensure the app points to the llm_api service inside the Docker network
      - LLM_BASE_URL=http://llm_api:8001
      - LLM_API_KEY=dummy
      - LLM_MODEL=skinsense-local
      - LLM_TIMEOUT_SECONDS=20
    depends_on:
      - llm_api
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db

